resources:
  apps:
    hospital_ops_app:
      name: "${bundle.target}-hospital-control-tower"
      description: "AI-powered operations intelligence for hospital logistics"
      source_code_path: ../app

      resources:
        - name: warehouse_id
          sql_warehouse:
            id: ${var.warehouse_id}
            permission: "CAN_USE"
        - name: embedding_model
          serving_endpoint:
            name: databricks-gte-large-en
            permission: "CAN_QUERY"
        - name: encounters_index
          uc_securable:
            securable_type: TABLE
            securable_full_name: ${var.catalog}.${var.schema}.encounters_vector_index
            permission: SELECT
