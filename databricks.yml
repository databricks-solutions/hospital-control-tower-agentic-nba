bundle:
  name: investment_intel_nba_app
  databricks_cli_version: ">=0.234.*"

sync:
  include:
    - app/app.yaml

include:
  - variables.yml
  - resources/*.yml

targets:
  dev:
    mode: development
    default: true
    workspace:
      host: https://fe-vm-hls-amer.cloud.databricks.com/ # workspace URL
    variables:
      catalog: hls-fe-onboarding # Unity Catalog name, you need to have manage permission to this catalog
      schema: investment_intel
      warehouse_id: 68d156b1d8b5502b # SQL Warehouse ID
      vector_search_endpoint: yyang_demo_investment_intel_vector_endpoint # Vector Search endpoint name
      node_type_id: i3.xlarge

  prod:
    mode: production
    workspace:
      host: ${var.workspace_host}
      root_path: ${var.root_path}
    permissions:
      - user_name: ${var.deploying_user}
        level: CAN_MANAGE
    run_as:
      user_name: ${var.deploying_user}
